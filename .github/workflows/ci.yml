name: CI / Cross-Platform Build & Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (npm ci --no-optional)
        shell: bash
        run: |
          npm ci --no-optional
        env:
          CI: 'true'

      - name: Type Check & Lint
        shell: bash
        run: npm run lint

      - name: Build Production Assets
        shell: bash
        run: npm run build
        env:
          NODE_ENV: 'production'

      - name: Verify Build Artifacts
        shell: bash
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated!"
            exit 1
          fi
          echo "Production build verified successfully on ${{ matrix.os }} (Node ${{ matrix.node-version }})."

      - name: Upload Build Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: web-production-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
