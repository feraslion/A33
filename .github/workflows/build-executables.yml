name: Build Executables (EXE & APK)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Desktop Windows Executable (.exe)
  # -------------------------------------------------------------
  build-windows-exe:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application (React + Vite)
        run: npm run build

      - name: Install Electron & Packaging Tools
        run: |
          npm install --no-save electron electron-builder

      - name: Package Windows Executable (.exe)
        run: |
          # Use electron-builder to pack the application with the local files
          npx electron-builder --win --portable -c.asar=true -c.directories.output=build-desktop -c.files=["dist/**/*", "electron-main.js", "electron-preload.js"] -c.win.target="portable" -c.productName="EnterpriseERP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: build-desktop/*.exe
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 2: Build Mobile Android Application (.apk)
  # -------------------------------------------------------------
  build-android-apk:
    name: Build Android Mobile App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application (React + Vite)
        run: npm run build

      - name: Install Capacitor Tools
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init "Enterprise ERP System" "com.enterprise.erpsystem" --web-dir=dist
          npx cap add android

      - name: Sync Web Code into Android Project
        run: |
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
